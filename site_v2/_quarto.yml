project:
  type: website
  output-dir: ../docs/v2
  resources:
    - data/*
    - assets/*

lang: pt
website:
  title: "Cidade verde para quem? (v2)"

execute:
  echo: false

format:
  html:
    # sem fórmulas com $...$: senão dois ${...} do OJS no mesmo parágrafo viram matemática
    from: markdown-tex_math_dollars
    theme: darkly
    css: styles.css
    toc: true
    toc-title: "Nesta história"
    toc-depth: 2
    number-sections: true
    lightbox: true
    smooth-scroll: true
    grid:
      body-width: 720px
      margin-width: 260px
      sidebar-width: 0px
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
          <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
          <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
